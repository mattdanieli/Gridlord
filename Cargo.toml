[package]
name = "gridlord"
version = "2.0.0"
edition = "2024"
description = "Gridlord - Playlist Organizer for FL Studio: group every clip by name onto neighbouring tracks"
license = "MIT"

[[bin]]
name = "Gridlord"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence", "clipboard", "x11", "accesskit"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
